name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Version, changelog, and npm release
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Leave registry-url unset: semantic-release manages npm authentication.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Publish release
        id: release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

  github-packages:
    name: Mirror release to GitHub Packages
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@eljijuna'
      - run: npm ci
      - run: npm run build
      - name: Scope the mirror package
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          npm pkg set name=@eljijuna/bubble-toolbar
          npm pkg set "version=$RELEASE_VERSION"
          npm pkg delete publishConfig.provenance
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
      - name: Publish mirror
        run: |
          PACKAGE_SPEC=$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')
          if npm view "$PACKAGE_SPEC" version --json --registry=https://npm.pkg.github.com > "$RUNNER_TEMP/mirror-version.json"; then
            echo "$PACKAGE_SPEC already exists in GitHub Packages; skipping."
          elif jq -e '.error.code == "E404"' "$RUNNER_TEMP/mirror-version.json" > /dev/null; then
            npm publish --ignore-scripts --registry=https://npm.pkg.github.com
          else
            echo "Could not check the mirror version in GitHub Packages."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'false'

  storybook:
    name: Deploy Storybook to GitHub Pages
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - run: npm run build-storybook
      - uses: actions/upload-pages-artifact@v4
        with:
          path: storybook-static
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
